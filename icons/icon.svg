<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1d1b18" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf5ec"/>
    </linearGradient>
  </defs>

  <!-- Base Dark Binding / Spine -->
  <rect x="18" y="14" width="92" height="100" rx="14" fill="#1d1b18" filter="url(#shadow)"/>

  <!-- Warm Paper Page -->
  <rect x="26" y="18" width="80" height="92" rx="10" fill="url(#paperGrad)"/>

  <!-- Left Spine Stitch Accent -->
  <line x1="33" y1="24" x2="33" y2="104" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/>

  <!-- Ruled Notebook Lines -->
  <line x1="42" y1="36" x2="94" y2="36" stroke="#d5cebe" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="48" x2="94" y2="48" stroke="#d5cebe" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="60" x2="80" y2="60" stroke="#d5cebe" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Terracotta Waveform (Voice / Audio) -->
  <g fill="#c2410c">
    <!-- Bar 1 -->
    <rect x="42" y="78" width="5" height="16" rx="2.5"/>
    <!-- Bar 2 -->
    <rect x="51" y="71" width="5" height="30" rx="2.5"/>
    <!-- Bar 3 (Peak) -->
    <rect x="60" y="66" width="5" height="40" rx="2.5"/>
    <!-- Bar 4 -->
    <rect x="69" y="73" width="5" height="26" rx="2.5"/>
    <!-- Bar 5 -->
    <rect x="78" y="69" width="5" height="34" rx="2.5"/>
    <!-- Bar 6 -->
    <rect x="87" y="77" width="5" height="18" rx="2.5"/>
  </g>

  <!-- Small terracotta pin dot -->
  <circle cx="95" cy="28" r="3.5" fill="#c2410c"/>
</svg>

